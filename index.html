<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajude a Raposa - 6º Ano</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff7e8;color:#2c2c2c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(680px,100%);background:white;border:2px solid #ead8bb;border-radius:22px;padding:28px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.emoji{font-size:64px;margin:4px 0 12px}
h1{font-size:32px;margin:8px 0}
p{font-size:19px;line-height:1.4}
button{width:100%;padding:16px;margin:8px 0;border:2px solid #e2cda8;border-radius:14px;background:#fff;font-size:18px;font-weight:700;cursor:pointer}
button:hover{background:#fff4d7}
.primary{background:#ffd86b;border-color:#e3b83c}
.primary:hover{background:#ffcf4d}
.top{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:20px}
.question{text-align:left;font-size:24px;font-weight:700;margin:15px 0}
.feedback{min-height:32px;font-size:19px;font-weight:700;margin:10px 0}
.hidden{display:none}
.correct{background:#e8f7e8!important;border-color:#69a969!important}
.wrong{background:#fdeaea!important;border-color:#c86a6a!important}
small{display:block;margin-top:18px;color:#666}
</style>
</head>
<body>
<main class="card">
<section id="start">
<div class="emoji">🦊 🍇</div>
<h1>Ajude a Raposa!</h1>
<p>Responda 5 perguntas e ajude a raposa a chegar até as uvas.</p>
<button class="primary" id="startBtn">COMEÇAR</button>
<small>Língua Portuguesa • 6º ano</small>
</section>

<section id="game" class="hidden">
<div class="top"><span id="progress"></span><span id="score">⭐ 0 pontos</span></div>
<div class="emoji">🦊 ➜ 🍇</div>
<div class="question" id="question"></div>
<div id="answers"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<button class="primary hidden" id="nextBtn">PRÓXIMA</button>
</section>

<section id="end" class="hidden">
<div class="emoji">🦊 🏆 🍇</div>
<h1>Missão cumprida!</h1>
<p>Você ajudou a raposa a chegar às uvas!</p>
<p id="result" style="font-weight:700;font-size:24px"></p>
<button class="primary" id="restartBtn">JOGAR NOVAMENTE</button>
</section>
</main>

<script>
const questions=[
 {q:"Quem é a personagem principal da fábula?",a:["Raposa","Coelho","Cachorro"],c:0},
 {q:"O que a raposa queria alcançar?",a:["Maçãs","Uvas","Bananas"],c:1},
 {q:"Por que a raposa não conseguiu pegar as uvas?",a:["Estavam muito altas","Ela estava com sono","Estavam no chão"],c:0},
 {q:'Na frase “ELA olhou para os cachos”, ELA é:',a:["Pronome pessoal","Pronome possessivo","Pronome demonstrativo"],c:0},
 {q:'Na expressão “AQUELES cachos”, AQUELES é:',a:["Pronome pessoal","Pronome possessivo","Pronome demonstrativo"],c:2}
];
let current=0,hits=0,locked=false;
const $=id=>document.getElementById(id);
function showQuestion(){
 locked=false;$("feedback").textContent="";$("nextBtn").classList.add("hidden");
 $("progress").textContent=`Pergunta ${current+1} de ${questions.length}`;
 $("score").textContent=`⭐ ${hits*10} pontos`;
 $("question").textContent=questions[current].q;
 $("answers").innerHTML="";
 questions[current].a.forEach((answer,i)=>{
   const b=document.createElement("button");b.textContent=answer;
   b.addEventListener("click",()=>answerQuestion(i,b));
   $("answers").appendChild(b);
 });
}
function answerQuestion(i,button){
 if(locked)return;locked=true;
 const buttons=[...$("answers").querySelectorAll("button")];
 buttons.forEach(b=>b.disabled=true);
 if(i===questions[current].c){
   hits++;button.classList.add("correct");$("feedback").textContent="✅ Muito bem!";
 }else{
   button.classList.add("wrong");buttons[questions[current].c].classList.add("correct");
   $("feedback").textContent="❌ Quase! Veja a resposta correta.";
 }
 $("score").textContent=`⭐ ${hits*10} pontos`;
 $("nextBtn").textContent=current===questions.length-1?"VER RESULTADO":"PRÓXIMA";
 $("nextBtn").classList.remove("hidden");
}
$("startBtn").addEventListener("click",()=>{
 $("start").classList.add("hidden");$("game").classList.remove("hidden");current=0;hits=0;showQuestion();
});
$("nextBtn").addEventListener("click",()=>{
 current++;
 if(current<questions.length)showQuestion();
 else{
   $("game").classList.add("hidden");$("end").classList.remove("hidden");
   $("result").textContent=`Você acertou ${hits} de ${questions.length} — ${hits*10} pontos!`;
 }
});
$("restartBtn").addEventListener("click",()=>{
 $("end").classList.add("hidden");$("start").classList.remove("hidden");
});
</script>
</body>
</html>
